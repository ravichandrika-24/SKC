<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SKC Admin Orders</title>
<link rel="stylesheet" href="/style.css">
<style>
.admin-wrap{max-width:1100px;margin:40px auto;padding:0 20px}
.admin-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}
.admin-head h1{margin:0;color:#3d1025}
.admin-refresh{background:#e21b5a;color:#fff;border:0;padding:12px 18px;border-radius:10px;cursor:pointer}
.order{background:#fff;border:1px solid #eee5e8;border-radius:16px;padding:20px;margin-bottom:15px;box-shadow:0 5px 20px #3d102510}
.order-top{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}
.order-id{font-weight:800;color:#3d1025}
.status{font-weight:700;color:#e21b5a}
.order-items{margin:15px 0;color:#756b71;white-space:pre-wrap}
.order-bottom{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.status-select{padding:10px;border:1px solid #ddd;border-radius:9px}
.empty{text-align:center;padding:50px;color:#756b71}
</style>
</head>
<body>

<div class="admin-wrap">
  <div class="admin-head">
    <div>
      <h1>SKC Admin Orders</h1>
      <p>Manage customer orders</p>
    </div>
    <button class="admin-refresh" onclick="loadOrders()">Refresh Orders</button>
  </div>

  <div id="orders">
    <div class="empty">Loading orders...</div>
  </div>
</div>

<script>
async function loadOrders(){
  const box=document.getElementById("orders");
  box.innerHTML='<div class="empty">Loading orders...</div>';

  try{
    const response=await fetch("/api/admin/orders");
    const data=await response.json();

    if(!response.ok) throw new Error(data.error||"Unable to load orders");

    if(!data.length){
      box.innerHTML='<div class="empty">No orders yet.</div>';
      return;
    }

    box.innerHTML=data.map(order=>`
      <div class="order">
        <div class="order-top">
          <div class="order-id">Order #${order.id}</div>
          <div class="status">${order.status}</div>
        </div>

        <div class="order-items">${escapeHtml(order.items)}</div>

        <div class="order-bottom">
          <strong>₹${Number(order.total).toFixed(2)}</strong>
          <span>Customer: ${escapeHtml(order.phone)}</span>

          <select class="status-select"
                  onchange="updateStatus(${order.id},this.value)">
            ${["Placed","Preparing","Ready","Out for Delivery","Delivered","Cancelled"]
              .map(s=>`<option ${s===order.status?"selected":""}>${s}</option>`).join("")}
          </select>
        </div>
      </div>
    `).join("");

  }catch(error){
    box.innerHTML='<div class="empty">Unable to load orders.</div>';
  }
}

async function updateStatus(id,status){
  const response=await fetch("/api/admin/orders/"+id,{
    method:"PATCH",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({status})
  });

  if(!response.ok){
    alert("Could not update order");
    return;
  }

  loadOrders();
}

function escapeHtml(value){
  return String(value||"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

loadOrders();
</script>

</body>
</html>
