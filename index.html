<!DOCTYPE html>
<html>
<head>
    <title>SKC Food Ordering System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🍔 SKC Food Ordering System</h1>
<p>Your food, delivered to your door</p>

<h2>Restaurants</h2>
<div id="restaurants"></div>

<h2>Place Your Order</h2>

<form id="orderForm">

    <input id="customer" type="text" placeholder="Your Name" required>

    <input id="phone" type="text" placeholder="10-digit Phone" required>

    <input id="address" type="text" placeholder="Delivery Address" required>

    <select id="restaurant" required>
        <option value="">Choose restaurant</option>
    </select>

    <select id="item" required>
        <option value="">Choose food item</option>
    </select>

    <button type="submit">Place Order</button>

</form>

<p id="message"></p>

<script src="script.js"></script>

</body>
</html>
