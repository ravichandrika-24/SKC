<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SKC Rider</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f8f3f0;color:#241515}
header{background:#7b1730;color:white;padding:22px;text-align:center}
.container{max-width:700px;margin:25px auto;padding:15px}
.card{background:white;border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 5px 20px #0001}
input,button{width:100%;box-sizing:border-box;padding:14px;margin:7px 0;border-radius:10px;border:1px solid #ddd;font-size:16px}
button{background:#7b1730;color:white;border:0;font-weight:bold;cursor:pointer}
.order{border-top:1px solid #eee;padding-top:15px;margin-top:15px}
.status{font-weight:bold;color:#7b1730}
.small{color:#777}
</style>
</head>
<body>
<header><h1>SKC Rider</h1><div>Delivery Dashboard</div></header>

<div class="container">
<div class="card">
<h2>Rider Login</h2>
<input id="phone" placeholder="Rider phone number" value="9999999999">
<button onclick="loadOrders()">View Orders</button>
</div>

<div id="orders"></div>
</div>

<script>
const BASE = location.origin;

async function loadOrders(){
    const phone=document.getElementById("phone").value.trim();
    if(!phone){alert("Enter rider phone");return;}

    const box=document.getElementById("orders");
    box.innerHTML='<div class="card">Loading orders...</div>';

    try{
        const r=await fetch(`${BASE}/api/rider/orders?phone=${encodeURIComponent(phone)}`);
        const data=await r.json();

        if(!Array.isArray(data) || data.length===0){
            box.innerHTML='<div class="card"><h2>No active orders</h2><p class="small">New delivery orders will appear here.</p></div>';
            return;
        }

        box.innerHTML=data.map(o=>{
            let items=[];
            try{items=JSON.parse(o.items||"[]")}catch(e){}
            const itemText=items.map(i=>`${i.name} × ${i.quantity}`).join(", ");

            let action="";
            if(o.status==="Placed"){
                action=`<button onclick="acceptOrder(${o.id})">Accept Order</button>`;
            }else if(o.status==="Out for Delivery" && o.rider_phone===phone){
                action=`<button onclick="deliverOrder(${o.id})">Mark Delivered</button>`;
            }else if(o.rider_phone===phone){
                action=`<p class="status">Assigned to you</p>`;
            }

            return `
            <div class="card order">
                <h2>Order #${o.id}</h2>
                <p><b>Items:</b> ${itemText}</p>
                <p><b>Total:</b> ₹${o.total}</p>
                <p><b>Customer Phone:</b> ${o.phone}</p>
                <p><b>Status:</b> <span class="status">${o.status}</span></p>
                ${action}
            </div>`;
        }).join("");
    }catch(e){
        box.innerHTML='<div class="card"><b>Unable to load orders.</b><br>Please try again.</div>';
    }
}

async function acceptOrder(id){
    const phone=document.getElementById("phone").value.trim();

    const r=await fetch(`${BASE}/api/rider/orders/${id}/accept`,{
        method:"PATCH",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({phone})
    });

    const data=await r.json();
    alert(data.message || data.error || "Done");
    loadOrders();
}

async function deliverOrder(id){
    const phone=document.getElementById("phone").value.trim();

    const r=await fetch(`${BASE}/api/rider/orders/${id}/status`,{
        method:"PATCH",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({phone,status:"Delivered"})
    });

    const data=await r.json();
    alert(data.message || data.error || "Done");
    loadOrders();
}

loadOrders();
</script>
</body>
</html>
