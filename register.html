<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foodie - Restaurant Registration</title>
  <style>
    body { font-family: Arial; background: #f5f5f5; padding: 20px; }
    form { max-width: 400px; margin: auto; background: white; padding: 25px; border-radius: 12px; }
    input, textarea, button { box-sizing: border-box; width: 100%; padding: 12px; margin: 8px 0; }
    button { background: #ff6b00; color: white; border: 0; cursor: pointer; }
    h2 { text-align: center; }
  </style>
</head>
<body>
  <form id="registerForm">
    <h2>Restaurant Registration</h2>
    <input name="restaurant" placeholder="Restaurant Name" required>
    <input name="owner" placeholder="Owner Name" required>
    <input name="phone" placeholder="Phone Number" required>
    <input name="address" placeholder="Restaurant Address" required>
    <textarea name="menu" placeholder="Menu items (comma-separated)" required></textarea>
    <button type="submit">Register</button>
    <p id="message"></p>
  </form>
  <script>
    document.getElementById("registerForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(this));
      try {
        const response = await fetch("/api/restaurants", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(data)
        });
        const result = await response.json();
        document.getElementById("message").textContent =
          response.ok ? "Registration successful!" : (result.error || "Registration failed");
      } catch (error) {
        document.getElementById("message").textContent = "Server connection failed. Please try again.";
      }
    });
  </script>
</body>
</html>
